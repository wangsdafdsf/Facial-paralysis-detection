{% extends 'parent.html' %}

{% block main_content %}
    <div class="main-conversation">
        <div id="conversation-history" class="conversation-history">
            {% if conversations %}
                {% for conv in conversations %}
                    <!-- 用户输入 -->
                    <div class="message user">
                        <div class="message-content">
                            <p>{{ conv.user_input }}</p>
                            <small class="time">{{ conv.created_at }}</small>
                        </div>
                    </div>
                    <!-- AI回复 -->
                    <div class="message ai">
                        <div class="message-content">
                            <p>{{ conv.model_response }}</p>
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="no-history">暂无对话记录</div>
            {% endif %}
        </div>
        {% if conversations %}
            <form action="{{ url_for('User.delete_all_conversations') }}" method="post" onsubmit="return confirm('确定要删除所有历史记录吗？')" class="clear-form">
                <button type="submit" class="clear-btn">清除历史</button>
            </form>
        {% endif %}
    </div>
{% endblock %}
